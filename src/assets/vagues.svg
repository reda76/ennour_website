<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <!-- Trame de vagues — motif répétable en X (période 120, deux périodes par tuile).
       Les tracés commencent et finissent à la même ordonnée avec la même tangente :
       la tuile se raccorde sans couture. Traits blancs volontairement : le fichier
       sert de MASQUE CSS (.lp-vagues), la couleur vient de la feuille de style. -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round">
    <path opacity=".45" stroke-width="1.1"
          d="M0 16 C20 9 40 9 60 16 C80 23 100 23 120 16 C140 9 160 9 180 16 C200 23 220 23 240 16"/>
    <path opacity=".9" stroke-width="1.5"
          d="M0 34 C20 43 40 43 60 34 C80 25 100 25 120 34 C140 43 160 43 180 34 C200 25 220 25 240 34"/>
    <path opacity=".35" stroke-width="1"
          d="M0 50 C20 45 40 45 60 50 C80 55 100 55 120 50 C140 45 160 45 180 50 C200 55 220 55 240 50"/>
  </g>
</svg>
