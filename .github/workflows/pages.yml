name: Vérification et déploiement

# DEUX cibles, et elles ne se déploient pas de la même façon :
#
# — Netlify sert le site du client à la RACINE du domaine et construit
#   lui-même à chaque push. Rien à faire ici pour lui, sinon vérifier que
#   le dépôt est sain AVANT que Netlify ne s'en empare.
# — GitHub Pages sert le dépôt de travail sous /nom-du-depot/, ce qui
#   impose un `--base` que Netlify ne doit surtout pas recevoir.
#
# D'où deux tâches distinctes. La première tourne partout et reproduit
# exactement ce que fait Netlify. La seconde ne tourne que là où Pages est
# réellement activé : sur un dépôt où il ne l'est pas, `configure-pages`
# échoue, et l'activer demande des droits d'administration qu'un
# collaborateur en écriture n'a pas.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Le garde-fou : il tourne sur TOUS les dépôts, y compris celui du client.
  # Un lint ou un build cassé est vu ici avant d'atteindre Netlify.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build NU, sans --base : c'est la commande de netlify.toml.
      - run: npm run build

  # Déploiement GitHub Pages, réservé au dépôt de travail. Le site du client
  # part sur Netlify ; son dépôt devient privé, où Pages demanderait de toute
  # façon une offre payante.
  pages:
    if: github.repository_owner == 'reda76'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages sert sous un sous-chemin : sans --base, les URL des assets
      # pointent sur la racine du domaine et la page reste blanche.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: pages
    if: github.repository_owner == 'reda76'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
